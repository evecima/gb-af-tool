<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1261a0"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="On-Call"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><title>On-Call Maintenance Assistant v0.5.0</title><link rel="stylesheet" href="./styles-1.css"><link rel="stylesheet" href="./styles-2.css"><link rel="stylesheet" href="./styles-3.css"><link rel="stylesheet" href="./styles-4.css"></head><body><div id="boot" style="padding:20px;font-family:system-ui">Loading On-Call Maintenance Assistant…</div><script>(async()=>{const ui=await Promise.all(['./ui-1.html','./ui-2.html','./ui-3.html','./ui-4.html'].map(x=>fetch(x).then(r=>r.text())));document.body.innerHTML=ui.join('');const load=s=>new Promise((ok,fail)=>{const x=document.createElement('script');x.src=s;x.onload=ok;x.onerror=fail;document.body.appendChild(x)});await load('../apartments.js');window.APARTMENT_DATA=(window.APARTMENT_DATA||[]).map(a=>({...a,code:a.code||`${a.building}-${a.unit}`}));for(const s of ['./seeds-1.js','./seeds-2.js','./seeds-3.js','./seeds-4.js','./app-01.js','./app-02.js','./app-03.js','./app-04.js','./app-05.js','./app-06.js','./app-07.js','./app-08.js'])await load(s)})().catch(e=>{document.body.innerHTML='<pre style="padding:20px">App failed to load: '+String(e)+'</pre>'});</script></body></html>
